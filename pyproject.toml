[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faigri-rank-gate"
version = "3.0.0"
description = "Rank–gate benchmark validator for higher-education AI procurement evidence"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.scripts]
faigri-rank-gate = "faigri_rank_gate.cli:main"
