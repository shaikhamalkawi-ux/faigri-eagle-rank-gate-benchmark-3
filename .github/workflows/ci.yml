name: benchmark-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct complete benchmark snapshot
        run: |
          chmod +x release/reconstruct_snapshot.sh
          release/reconstruct_snapshot.sh /tmp/benchmark.tar.xz
          mkdir -p _snapshot
          tar -xJf /tmp/benchmark.tar.xz -C _snapshot
      - name: Install dependencies
        working-directory: _snapshot
        run: python -m pip install -r requirements.txt
      - name: Run full reproducibility and conformance suite
        working-directory: _snapshot
        run: bash run_all.sh
      - name: Run Paper 3 ITT 2026 R8 paper-specific replay
        run: python paper3_itt2026_r8/reproduce_ITT2026_results.py
