name: benchmark-ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract complete benchmark snapshot
        run: |
          mkdir -p _snapshot
          tar -xJf release/FAIGRI_EAGLE_PAPER3_RANK_GATE_BENCHMARK_V3_GITHUB_PUBLIC_SNAPSHOT_20260908.tar.xz -C _snapshot
      - name: Install dependencies
        working-directory: _snapshot
        run: python -m pip install -r requirements.txt
      - name: Run full reproducibility and conformance suite
        working-directory: _snapshot
        run: bash run_all.sh
